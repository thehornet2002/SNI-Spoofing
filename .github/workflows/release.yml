name: Release & Build Multi-Platform

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SNI-Spoofing-GUI" `
            --add-data "config.json;." `
            --add-data "ips.txt;." `
            --add-data "snis.txt;." `
            --hidden-import "pydivert" `
            --hidden-import "scapy" `
            --hidden-import "tkinter" `
            main.py
          
          # Also build CLI standalone
          pyinstaller --noconfirm --onefile --console --name "SNI-Spoofing-CLI" `
            --add-data "config.json;." `
            --add-data "ips.txt;." `
            --add-data "snis.txt;." `
            --hidden-import "pydivert" `
            --hidden-import "scapy" `
            main.py

      - name: Copy auxiliary scripts
        run: |
          Copy-Item run.bat dist\SNI-Spoofing-GUI\
          Copy-Item config.json dist\SNI-Spoofing-GUI\
          Copy-Item ips.txt dist\SNI-Spoofing-GUI\
          Copy-Item snis.txt dist\SNI-Spoofing-GUI\
          Copy-Item README.md dist\SNI-Spoofing-GUI\

      - name: Archive Windows GUI Build
        run: |
          Compress-Archive -Path dist\SNI-Spoofing-GUI\* -DestinationPath dist\SNI-Spoofing-Windows-GUI.zip
          Compress-Archive -Path dist\SNI-Spoofing-CLI.exe, config.json, ips.txt, snis.txt, README.md -DestinationPath dist\SNI-Spoofing-Windows-CLI.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*.zip

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --noconfirm --onefile --console --name "sni-spoofing-linux" \
            --add-data "config.json:." \
            --add-data "ips.txt:." \
            --add-data "snis.txt:." \
            --hidden-import "scapy" \
            main.py

      - name: Package Linux Binary
        run: |
          mkdir -p dist/package
          cp dist/sni-spoofing-linux dist/package/
          cp config.json ips.txt snis.txt README.md dist/package/
          chmod +x dist/package/sni-spoofing-linux
          tar -czvf dist/SNI-Spoofing-Linux.tar.gz -C dist/package .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets/

      - name: Set Release Tag
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "release_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Release (Latest Build)" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
